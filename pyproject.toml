[project]
name = "dog-breed-classifier"
version = "0.1.0"
description = "Transfer-learning dog breed classifier using a frozen ResNet-152 backbone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.scripts]
dog-breed-classifier = "dog_breed_classifier:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dog_breed_classifier"]
